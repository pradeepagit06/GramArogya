</main>

<script>

    const API_BASE_URL =
        "http://localhost:4000";


    const token =
        localStorage.getItem(
            "gramarogya_token"
        );


    if (!token) {

        window.location.href =
            "gramarogya_login.html";

    }


    // ========================================
    // LOGOUT
    // ========================================

    function logout() {

        localStorage.removeItem(
            "gramarogya_token"
        );

        localStorage.removeItem(
            "gramarogya_user"
        );

        localStorage.removeItem(
            "gramarogya_role"
        );

        window.location.href =
            "gramarogya_login.html";
    }


    // ========================================
    // SHOW MESSAGE
    // ========================================

    function showMessage(
        message,
        type
    ) {

        const messageBox =
            document.getElementById(
                "formMessage"
            );

        messageBox.textContent =
            message;

        messageBox.className =
            "message " + type;

        messageBox.style.display =
            "block";
    }


    // ========================================
    // FORMAT DATE
    // ========================================

    function formatDate(
        dateString
    ) {

        if (!dateString) {
            return "Not available";
        }

        const date =
            new Date(dateString);

        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
    }


    // ========================================
    // LOAD APPOINTMENTS
    // ========================================

    async function loadAppointments() {

        const appointmentSelect =
            document.getElementById(
                "appointmentId"
            );


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/appointments/my`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to load appointments"
                );

            }


            const appointments =
                data.appointments || [];


            const activeAppointments =
                appointments.filter(
                    appointment =>
                        appointment.status === "booked"
                );


            activeAppointments.forEach(
                appointment => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        appointment.id;


                    const date =
                        appointment.scheduled_date
                            ? formatDate(
                                appointment.scheduled_date
                              )
                            : "Date not available";


                    const time =
                        appointment.scheduled_time
                            ? appointment.scheduled_time
                                .toString()
                                .substring(0, 5)
                            : "Time not assigned";


                    option.textContent =
                        `${date} — ${time}`;


                    appointmentSelect.appendChild(
                        option
                    );

                }
            );


        } catch (error) {

            console.error(
                "Load appointments error:",
                error
            );

        }

    }


    // ========================================
    // LOAD CONSULTATIONS
    // ========================================

    async function loadConsultations() {

        const container =
            document.getElementById(
                "consultationsContainer"
            );


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/consultations/my`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            console.log(
                "Consultations response:",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to load consultations"
                );

            }


            const consultations =
                data.consultations || [];


            if (
                consultations.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        No consultations found.
                    </div>
                `;

                return;
            }


            container.innerHTML =
                consultations
                    .map(
                        consultation => {

                            let symptomsText =
                                "Not provided";


                            if (
                                Array.isArray(
                                    consultation.symptoms
                                ) &&
                                consultation.symptoms.length > 0
                            ) {

                                symptomsText =
                                    consultation.symptoms
                                        .join(", ");

                            } else if (
                                typeof consultation.symptoms ===
                                "string" &&
                                consultation.symptoms.trim()
                            ) {

                                symptomsText =
                                    consultation.symptoms;

                            }


                            return `

                                <div
                                    class="consultation-item"
                                >

                                    <h3>
                                        Doctor Consultation
                                    </h3>

                                    <p>
                                        <strong>
                                            Consultation ID:
                                        </strong>
                                        ${consultation.id}
                                    </p>

                                    <p>
                                        <strong>
                                            Doctor:
                                        </strong>
                                        ${
                                            consultation.doctor_name ||
                                            "Doctor not assigned"
                                        }
                                    </p>

                                    <p>
                                        <strong>
                                            Facility:
                                        </strong>
                                        ${
                                            consultation.facility_name ||
                                            "Facility not assigned"
                                        }
                                    </p>

                                    <p>
                                        <strong>
                                            Mode:
                                        </strong>
                                        ${
                                            consultation.mode ||
                                            "Not specified"
                                        }
                                    </p>

                                    <p>
                                        <strong>
                                            Symptoms / Reason:
                                        </strong>
                                        ${symptomsText}
                                    </p>

                                    <p>
                                        <strong>
                                            Created:
                                        </strong>
                                        ${
                                            formatDate(
                                                consultation.created_at
                                            )
                                        }
                                    </p>

                                    <span
                                        class="status"
                                    >
                                        ${
                                            consultation.status ||
                                            "pending"
                                        }
                                    </span>

                                </div>

                            `;

                        }
                    )
                    .join("");

    } catch (error) {

        console.error(
            "Load consultations error:",
            error
        );


        container.innerHTML = `

            <div
                class="message error"
                style="display:block;"
            >
                ${error.message}
            </div>

        `;

    }

    }


    // ========================================
    // REQUEST CONSULTATION
    // ========================================

    document
        .getElementById(
            "consultationForm"
        )
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const appointmentId =
                    document.getElementById(
                        "appointmentId"
                    ).value;


                const mode =
                    document.getElementById(
                        "mode"
                    ).value;


                const symptomsText =
                    document.getElementById(
                        "symptoms"
                    ).value.trim();


                const requestButton =
                    document.getElementById(
                        "requestButton"
                    );


                if (!symptomsText) {

                    showMessage(
                        "Please enter your symptoms or reason.",
                        "error"
                    );

                    return;
                }


                /*
                 * Backend expects:
                 * appointment_id
                 * facility_id
                 * mode
                 * symptoms
                 * vitals
                 */

                let facilityId = null;


                /*
                 * Facility is not required by the backend.
                 * When appointment is selected, we can
                 * retrieve its facility from the appointment
                 * list if available.
                 */

                const requestBody = {

                    appointment_id:
                        appointmentId || null,

                    facility_id:
                        facilityId,

                    mode:
                        mode,

                    symptoms:
                        [symptomsText],

                    vitals:
                        {}

                };


                console.log(
                    "Consultation request:",
                    requestBody
                );


                try {

                    requestButton.disabled =
                        true;

                    requestButton.textContent =
                        "Requesting...";


                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/consultations/request`,
                            {
                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`

                                },

                                body:
                                    JSON.stringify(
                                        requestBody
                                    )

                            }
                        );


                    const data =
                        await response.json();


                    console.log(
                        "Consultation response:",
                        data
                    );


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Failed to request consultation"
                        );

                    }


                    showMessage(
                        "Consultation requested successfully!",
                        "success"
                    );


                    document
                        .getElementById(
                            "consultationForm"
                        )
                        .reset();


                    document.getElementById(
                        "mode"
                    ).value =
                        "in_person";


                    await loadConsultations();


                } catch (error) {

                    console.error(
                        "Consultation request error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Failed to request consultation",
                        "error"
                    );


                } finally {

                    requestButton.disabled =
                        false;

                    requestButton.textContent =
                        "Request Consultation";

                }

            }
        );


    // ========================================
    // INITIAL LOAD
    // ========================================

    loadAppointments();

    loadConsultations();

</script>

</body>
