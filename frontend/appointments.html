<title>GramArogya — Appointments</title>

<style>
    * {

```
<header class="header">
    <h1>GramArogya</h1>
    <button onclick="logout()">Logout</button>
</header>

<main class="container">

    <a href="patient-dashboard.html" class="back-link">
        ← Back to Dashboard
    </a>

    <!-- BOOK APPOINTMENT -->
    <section class="card">

        <h2>Book an Appointment</h2>

        <div class="info-box">
            Select your preferred date and time. Your appointment will be booked at GramArogya Primary Health Centre.
        </div>

        <form id="appointmentForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="doctorId">Doctor</label>

                    <select id="doctorId">
                        <option value="124ebc0f-7065-4933-8ead-5b0cb5b7f557">
                            Dr. Test Doctor
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="General Medicine">General Medicine</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Gynecology">Gynecology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="General">General</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="appointmentDate">Appointment Date</label>

                    <input
                        type="date"
                        id="appointmentDate"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="appointmentTime">Appointment Time</label>

                    <input
                        type="time"
                        id="appointmentTime"
                    >
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>

                    <select id="priority">
                        <option value="normal">Normal</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>

            </div>

            <button
                type="submit"
                class="primary"
                id="bookButton"
            >
                Book Appointment
            </button>

            <div id="formMessage" class="message"></div>

        </form>

    </section>

    <!-- MY APPOINTMENTS -->
    <section class="card">

        <h2>My Appointments</h2>

        <div id="appointmentsContainer" class="appointment-list">
            <div class="loading">
                Loading appointments...
            </div>
        </div>

    </section>

</main>

<script>

    const API_BASE_URL = "http://localhost:4000";

    const FACILITY_ID =
        "abd74ee2-f3fa-4a96-8bd8-6d830481fe12";

    const DOCTOR_ID =
        "124ebc0f-7065-4933-8ead-5b0cb5b7f557";


    // ========================================
    // GET TOKEN
    // ========================================

    const token =
        localStorage.getItem("gramarogya_token");


    if (!token) {
        window.location.href = "gramarogya_login.html";
    }


    // ========================================
    // LOGOUT
    // ========================================

    function logout() {

        localStorage.removeItem("gramarogya_token");
        localStorage.removeItem("gramarogya_user");
        localStorage.removeItem("gramarogya_role");

        window.location.href =
            "gramarogya_login.html";
    }


    // ========================================
    // MESSAGE
    // ========================================

    function showMessage(message, type) {

        const messageBox =
            document.getElementById("formMessage");

        messageBox.textContent = message;

        messageBox.className =
            "message " + type;

        messageBox.style.display = "block";
    }


    // ========================================
    // FORMAT DATE
    // ========================================

    function formatDate(dateString) {

        if (!dateString) {
            return "Not specified";
        }

        const date =
            new Date(dateString);

        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
    }


    // ========================================
    // FORMAT TIME
    // ========================================

    function formatTime(timeString) {

        if (!timeString) {
            return "Not specified";
        }

        return timeString.substring(0, 5);
    }


    // ========================================
    // LOAD APPOINTMENTS
    // ========================================

    async function loadAppointments() {

        const container =
            document.getElementById(
                "appointmentsContainer"
            );

        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/appointments/my`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to load appointments"
                );
            }


            const appointments =
                data.appointments || [];


            if (appointments.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No appointments found.
                    </div>
                `;

                return;
            }


            container.innerHTML =
                appointments
                    .map(appointment => {

                        const status =
                            appointment.status || "unknown";


                        const canCancel =
                            status === "booked";


                        return `
                            <div class="appointment-item">

                                <h3>
                                    Appointment
                                </h3>

                                <p>
                                    <strong>Date:</strong>
                                    ${formatDate(
                                        appointment.scheduled_date
                                    )}
                                </p>

                                <p>
                                    <strong>Time:</strong>
                                    ${formatTime(
                                        appointment.scheduled_time
                                    )}
                                </p>

                                <p>
                                    <strong>Department:</strong>
                                    ${
                                        appointment.department ||
                                        "General"
                                    }
                                </p>

                                <p>
                                    <strong>Priority:</strong>
                                    ${
                                        appointment.priority ||
                                        "normal"
                                    }
                                </p>

                                <p>
                                    <strong>Queue Number:</strong>
                                    ${
                                        appointment.queue_number ||
                                        "Not assigned"
                                    }
                                </p>

                                <span class="status">
                                    ${status}
                                </span>

                                ${
                                    canCancel
                                        ? `
                                            <br>
                                            <button
                                                class="cancel-btn"
                                                onclick="cancelAppointment('${appointment.id}')"
                                            >
                                                Cancel Appointment
                                            </button>
                                          `
                                        : ""
                                }

                            </div>
                        `;

                    })
                    .join("");

        } catch (error) {

            console.error(
                "Load appointments error:",
                error
            );

            container.innerHTML = `
                <div class="message error"
                     style="display:block;">
                    ${error.message}
                </div>
            `;
        }
    }


    // ========================================
    // BOOK APPOINTMENT
    // ========================================

    document
        .getElementById("appointmentForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const doctorId =
                    document.getElementById(
                        "doctorId"
                    ).value;


                const department =
                    document.getElementById(
                        "department"
                    ).value;


                const priority =
                    document.getElementById(
                        "priority"
                    ).value;


                const appointmentDate =
                    document.getElementById(
                        "appointmentDate"
                    ).value;


                const appointmentTime =
                    document.getElementById(
                        "appointmentTime"
                    ).value;


                const bookButton =
                    document.getElementById(
                        "bookButton"
                    );


                if (!appointmentDate) {

                    showMessage(
                        "Please select an appointment date.",
                        "error"
                    );

                    return;
                }


                // IMPORTANT:
                // Backend expects snake_case names.
                const requestBody = {

                    facility_id:
                        FACILITY_ID,

                    doctor_id:
                        doctorId || null,

                    department:
                        department || null,

                    priority:
                        priority || "normal",

                    scheduled_date:
                        appointmentDate,

                    scheduled_time:
                        appointmentTime || null
                };


                console.log(
                    "Booking request:",
                    requestBody
                );


                try {

                    bookButton.disabled = true;

                    bookButton.textContent =
                        "Booking...";


                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/appointments/book`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`
                                },

                                body:
                                    JSON.stringify(
                                        requestBody
                                    )
                            }
                        );


                    const data =
                        await response.json();


                    console.log(
                        "Booking response:",
                        data
                    );


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Failed to book appointment"
                        );
                    }


                    showMessage(
                        "Appointment booked successfully!",
                        "success"
                    );


                    document
                        .getElementById(
                            "appointmentForm"
                        )
                        .reset();


                    document.getElementById(
                        "priority"
                    ).value = "normal";


                    document.getElementById(
                        "doctorId"
                    ).value = DOCTOR_ID;


                    await loadAppointments();


                } catch (error) {

                    console.error(
                        "Booking error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Failed to book appointment",
                        "error"
                    );

                } finally {

                    bookButton.disabled = false;

                    bookButton.textContent =
                        "Book Appointment";
                }

            }
        );


    // ========================================
    // CANCEL APPOINTMENT
    // ========================================

    async function cancelAppointment(
        appointmentId
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to cancel this appointment?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/appointments/${appointmentId}/cancel`,
                    {
                        method: "PATCH",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to cancel appointment"
                );
            }


            alert(
                "Appointment cancelled successfully."
            );


            await loadAppointments();


        } catch (error) {

            console.error(
                "Cancel appointment error:",
                error
            );


            alert(
                error.message ||
                "Failed to cancel appointment"
            );
        }
    }


    // ========================================
    // SET MINIMUM DATE = TODAY
    // ========================================

    function setMinimumDate() {

        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                today.getDate()
            ).padStart(2, "0");


        const todayString =
            `${year}-${month}-${day}`;


        document.getElementById(
            "appointmentDate"
        ).min = todayString;
    }


    // ========================================
    // INITIAL LOAD
    // ========================================

    setMinimumDate();

    loadAppointments();

</script>
