</main>

<script>

    const API_BASE_URL = "https://gramarogya-un6g.onrender.com";

    const token =
        localStorage.getItem("gramarogya_token");

    if (!token) {

        window.location.href =
            "gramarogya_login.html";

    }

    function getHeaders() {

        return {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        };

    }

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

    function showMessage(message, type) {

        const box =
            document.getElementById("formMessage");

        box.textContent = message;

        box.className =
            "message " +
            (type === "success"
                ? "success-message"
                : "error-message");

    }

    function formatDate(dateValue) {

        if (!dateValue) {
            return "-";
        }

        const date =
            new Date(dateValue);

        if (isNaN(date.getTime())) {
            return dateValue;
        }

        return date.toLocaleDateString();

    }

    function statusClass(status) {

        if (!status) {
            return "status-unknown";
        }

        return "status-" +
            status.toLowerCase();

    }

    async function loadProfileName() {

        try {

            const response =
                await fetch(
                    API_BASE_URL +
                    "/api/patient/profile",
                    {
                        method: "GET",
                        headers: getHeaders()
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {
                return;
            }

            const patient =
                data.patient;

            if (!patient) {
                return;
            }

            const name =
                patient.full_name ||
                "Patient";

            document.getElementById(
                "navUserName"
            ).textContent = name;

            document.getElementById(
                "welcomeText"
            ).textContent =
                "Diagnostics - " + name;

        } catch (error) {

            console.error(
                "Profile name error:",
                error
            );

        }

    }

    async function loadDiagnostics() {

        const tbody =
            document.getElementById(
                "diagnosticsTableBody"
            );

        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Loading diagnostic requests...
                </td>
            </tr>
        `;

        try {

            const response =
                await fetch(
                    API_BASE_URL +
                    "/api/diagnostics/my",
                    {
                        method: "GET",
                        headers: getHeaders()
                    }
                );

            const data =
                await response.json();

            console.log(
                "Diagnostics response:",
                data
            );

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to load diagnostics"
                );

            }

            let diagnostics = [];

            if (Array.isArray(data)) {

                diagnostics = data;

            } else if (
                Array.isArray(
                    data.diagnostic_requests
                )
            ) {

                diagnostics =
                    data.diagnostic_requests;

            } else if (
                Array.isArray(data.data)
            ) {

                diagnostics =
                    data.data;

            } else if (
                Array.isArray(data.rows)
            ) {

                diagnostics =
                    data.rows;

            }

            if (diagnostics.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty">
                            No diagnostic requests found.
                        </td>
                    </tr>
                `;

                return;

            }

            tbody.innerHTML = "";

            diagnostics.forEach(
                function (diagnostic) {

                    const row =
                        document.createElement("tr");

                    const testName =
                        diagnostic.test_name ||
                        "-";

                    const facility =
                        diagnostic.facility_name ||
                        "Not assigned";

                    const requestedDate =
                        formatDate(
                            diagnostic.requested_at
                        );

                    const status =
                        diagnostic.status ||
                        "unknown";

                    const action =
                        status === "completed"
                            ? `
                                <button
                                    class="view-btn"
                                    onclick="viewReport('${diagnostic.id}')"
                                >
                                    View Report
                                </button>
                              `
                            : "-";

                    row.innerHTML = `

                        <td>
                            ${escapeHtml(testName)}
                        </td>

                        <td>
                            ${escapeHtml(facility)}
                        </td>

                        <td>
                            ${escapeHtml(requestedDate)}
                        </td>

                        <td>
                            <span class="status ${statusClass(status)}">
                                ${escapeHtml(status)}
                            </span>
                        </td>

                        <td>
                            ${action}
                        </td>

                    `;

                    tbody.appendChild(row);

                }
            );

        } catch (error) {

            console.error(
                "Diagnostics error:",
                error
            );

            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Unable to load diagnostic requests.
                    </td>
                </tr>
            `;

        }

    }

    async function requestDiagnostic(event) {

        event.preventDefault();

        const testName =
            document.getElementById(
                "testName"
            ).value;

        const button =
            document.getElementById(
                "requestBtn"
            );

        if (!testName) {

            showMessage(
                "Please select a diagnostic test.",
                "error"
            );

            return;

        }

        button.disabled = true;
        button.textContent = "Requesting...";

        try {

            const response =
                await fetch(
                    API_BASE_URL +
                    "/api/diagnostics/request",
                    {
                        method: "POST",
                        headers: getHeaders(),
                        body: JSON.stringify({
                            test_name: testName
                        })
                    }
                );

            const data =
                await response.json();

            console.log(
                "Diagnostic request response:",
                data
            );

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to request diagnostic test"
                );

            }

            showMessage(
                "Diagnostic test requested successfully.",
                "success"
            );

            document.getElementById(
                "diagnosticForm"
            ).reset();

            await loadDiagnostics();

        } catch (error) {

            console.error(
                "Request diagnostic error:",
                error
            );

            showMessage(
                error.message ||
                "Failed to request diagnostic test.",
                "error"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Request Test";

        }

    }

    async function viewReport(requestId) {

        const reportBox =
            document.getElementById(
                "reportBox"
            );

        const reportContent =
            document.getElementById(
                "reportContent"
            );

        reportBox.style.display = "block";

        reportContent.innerHTML =
            "Loading report...";

        try {

            const response =
                await fetch(
                    API_BASE_URL +
                    "/api/diagnostics/" +
                    requestId,
                    {
                        method: "GET",
                        headers: getHeaders()
                    }
                );

            const data =
                await response.json();

            console.log(
                "Diagnostic report response:",
                data
            );

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to load report"
                );

            }

            const request =
                data.diagnostic_request;

            const reports =
                Array.isArray(data.reports)
                    ? data.reports
                    : [];

            let reportHtml = "";

            reportHtml += `
                <div class="report-item">

                    <div class="report-label">
                        Test Name
                    </div>

                    <div class="report-value">
                        ${escapeHtml(
                            request?.test_name || "-"
                        )}
                    </div>

                </div>

                <div class="report-item">

                    <div class="report-label">
                        Status
                    </div>

                    <div class="report-value">
                        ${escapeHtml(
                            request?.status || "-"
                        )}
                    </div>

                </div>
            `;

            if (reports.length === 0) {

                reportHtml += `
                    <div class="report-item">
                        <div class="report-label">
                            Result
                        </div>

                        <div class="report-value">
                            No report available.
                        </div>
                    </div>
                `;

            } else {

                reports.forEach(
                    function (report, index) {

                        reportHtml += `

                            <div class="report-item">

                                <div class="report-label">
                                    Report ${index + 1}
                                </div>

                                <div class="report-value">
                                    ${
                                        escapeHtml(
                                            report.result_summary ||
                                            "No result summary available."
                                        )
                                    }
                                </div>

                            </div>
                        `;

                        if (report.report_file_url) {

                            reportHtml += `

                                <div class="report-item">

                                    <div class="report-label">
                                        Report File
                                    </div>

                                    <div class="report-value">

                                        <a
                                            href="${escapeHtml(
                                                report.report_file_url
                                            )}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            View Report File
                                        </a>

                                    </div>

                                </div>

                            `;

                        }

                    }
                );

            }

            reportContent.innerHTML =
                reportHtml;

            reportBox.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        } catch (error) {

            console.error(
                "View report error:",
                error
            );

            reportContent.innerHTML = `
                <div class="error-message">
                    Unable to load diagnostic report.
                </div>
            `;

        }

    }

    function logout() {

        localStorage.removeItem(
            "gramarogya_token"
        );

        localStorage.removeItem(
            "gramarogya_user"
        );

        localStorage.removeItem(
            "gramarogya_role"
        );

        window.location.href =
            "gramarogya_login.html";

    }

    document.getElementById(
        "diagnosticForm"
    ).addEventListener(
        "submit",
        requestDiagnostic
    );

    async function loadPage() {

        await Promise.all([
            loadProfileName(),
            loadDiagnostics()
        ]);

    }

    loadPage();

</script>
